<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Lottie – prázdný průběh</title>
<style>body{margin:0;background:#0f141c;color:#fff;font:14px Roboto,system-ui;display:flex;gap:40px;padding:40px;align-items:flex-start}
.box{display:flex;flex-direction:column;align-items:center;gap:10px}#anim{width:352px;height:208px}</style>

</body></html>
